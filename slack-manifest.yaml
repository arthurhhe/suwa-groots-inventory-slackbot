# Create the app at https://api.slack.com/apps → Create New App → From a manifest.
# After deploying, replace https://YOUR-DEPLOYMENT.vercel.app with your URL (or let the setup
# script print it) and save. Slack will verify the request URL.
display_information:
  name: stuffbot
  description: Updates the inventory workbook and posts low-stock alerts.
  # Slack manifests cannot set the app icon. Upload clippy.jpg (512x512 minimum) under
  # Basic Information → Display Information → App icon after creating the app.
features:
  bot_user:
    display_name: stuffbot
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:history
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    request_url: https://YOUR-DEPLOYMENT.vercel.app/api/slack/events
    bot_events:
      - message.channels
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
